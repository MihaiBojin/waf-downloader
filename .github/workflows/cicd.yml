name: CI/CD
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v0.*"

# Least privilege by default: the jobs that only read the repo inherit this, and
# the ones that publish (push-docker, push-ghcr, release, helm) widen it for
# themselves. Without a default, GITHUB_TOKEN's scopes come from the repository
# setting, which is invisible from here and applies to every job equally.
# see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - uses: releasetools/cli@v0

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        # --locked fails the build on a stale uv.lock, rather than quietly
        # resolving something the lock file never described
        run: uv sync --all-extras --locked

      - name: Run linters
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest tests

  build:
    name: Build Python package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.14
          enable-cache: true

      - uses: releasetools/cli@v0

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the correct (tag) version
        run: |
          VERSION="$(releasetools git::version_or_sha)"
          echo "Updating version in '$VERSION_FILE' to: $VERSION" >&2
          echo "$VERSION" > ./VERSION

      - name: Build
        run: uv build

      - name: Cache build
        uses: actions/cache/save@v6
        with:
          path: .
          key: ${{ runner.os }}-build-${{ github.sha }}

  publish:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.14
          enable-cache: true

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore working directory
        uses: actions/cache/restore@v6
        with:
          path: .
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Upload to PyPI (test)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TESTPYPI_PASSWORD }}
        run: uv publish --index testpypi

      - name: Upload to PyPI (prod)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        run: uv publish

      - name: Verify package install from PyPI
        run: scripts/verify-publish.bash --prod

  push-docker:
    name: Build and/or push to Docker Hub
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      actions: read
      packages: write
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - uses: releasetools/cli@v0

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore working directory
        uses: actions/cache/restore@v6
        with:
          path: .
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate build tags
        run: |
          OWNER_REPO="$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" # format: org/repo
          echo "OWNER_REPO=$OWNER_REPO" >> "$GITHUB_ENV"

          REPO_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"

          VERSION="$(releasetools git::version_or_sha)"
          echo "Updating version in '$VERSION_FILE' to: $VERSION" >&2
          echo "$VERSION" > ./VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build multiplatform image
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64,linux/amd64
          # Only push image to registries on tag pushes
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=Cloudflare Web Application Firewall log downloader
            org.opencontainers.image.description="Cloudflare Web Application Firewall log downloader for a specified zone and time range"
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ github.sha }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.VERSION }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:latest

      - name: Generate artifact attestation
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
        uses: anchore/sbom-action@v0
        with:
          image: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.VERSION }}
          artifact-name: sbom_docker_${{ env.REPO_NAME }}_${{ env.VERSION }}.spdx.json

  push-ghcr:
    name: Build and/or push to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      actions: read
      packages: write
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Restore working directory
        uses: actions/cache/restore@v6
        with:
          path: .
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: releasetools/cli@v0

      - name: Generate build tags
        run: |
          OWNER_REPO="$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" # format: org/repo
          echo "OWNER_REPO=$OWNER_REPO" >> "$GITHUB_ENV"

          REPO_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"

          VERSION="$(releasetools git::version_or_sha)"
          echo "Updating version in '$VERSION_FILE' to: $VERSION" >&2
          echo "$VERSION" > ./VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build multiplatform image
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64,linux/amd64
          # Only push image to registries on tag pushes
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=Cloudflare Web Application Firewall log downloader
            org.opencontainers.image.description="Cloudflare Web Application Firewall log downloader for a specified zone and time range"
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ghcr.io/${{ env.OWNER_REPO }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_REPO }}:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_REPO }}:latest

      - name: Generate artifact attestation
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ env.OWNER_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.OWNER_REPO }}:${{ env.VERSION }}
          artifact-name: sbom_ghcr_${{ env.REPO_NAME }}_${{ env.VERSION }}.spdx.json

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - push-docker
      - push-ghcr

    # action-gh-release creates the release, and publish-sbom reads the SBOMs
    # uploaded as artifacts by the image jobs and attaches them to it. The
    # workflow default of contents:read is not enough for either.
    permissions:
      actions: read
      contents: write

    steps:
      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true

      - uses: anchore/sbom-action/publish-sbom@v0
        with:
          sbom-artifact-match: ".*\\.spdx\\.json$"

  helm:
    name: Publish Helm Chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    needs: release

    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - uses: releasetools/cli@v0

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set chart version
        run: |
          task set-chart-version

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR" # "github-actions[bot]"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com" # "github-actions[bot]@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      # Install cr only. The action's own release step runs
      # `cr upload -c "$(git rev-parse HEAD)"`, and its change detection diffs
      # tracked files under charts/ against the tag being released -- which is
      # the commit being built, so nothing ever looks changed. Driving cr
      # directly sidesteps both: every release tag publishes its chart, targeted
      # at a commit that exists on the remote.
      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          install_only: true

      - name: Package and publish the chart
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"

          cr package charts/waf-downloader --package-path .cr-release-packages

          # '-c "$GITHUB_SHA"' is the fix: on a tag build that is the tagged
          # commit, which GitHub can resolve. The generated Chart.yaml is
          # gitignored, so any commit made to make it visible to git would be
          # local to the runner, and GitHub rejects a release whose
          # target_commitish it has never seen (422, "not a valid tag").
          cr upload \
            --owner "$OWNER" \
            --git-repo "$REPO" \
            --commit "$GITHUB_SHA" \
            --skip-existing \
            --package-path .cr-release-packages

          cr index \
            --owner "$OWNER" \
            --git-repo "$REPO" \
            --push \
            --package-path .cr-release-packages

      # '--skip-existing' makes re-runs idempotent, which also means a chart
      # that failed to publish exits 0. On a tag build it must be there.
      - name: Verify the chart was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART_VERSION="$(awk '/^version:/ {print $2; exit}' charts/waf-downloader/Chart.yaml)"
          RELEASE="waf-downloader-${CHART_VERSION}"
          if ! gh release view "$RELEASE" --json tagName >/dev/null 2>&1; then
            echo "ERROR: chart release '$RELEASE' was not published" >&2
            exit 1
          fi
          echo "Published chart release '$RELEASE'" >&2
