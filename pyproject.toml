[project]
name = 'waf_downloader'
license = "Apache-2.0"
description = "Web Application Firewall logs downloader."
keywords = [
    "cloudflare",
    "waf",
    "web",
    "application",
    "firewall",
    "logs",
    "download",
]
readme = { "file" = "README.md", "content-type" = "text/markdown" }
authors = [
    { name = "Mihai Bojin", email = "557584+MihaiBojin@users.noreply.github.com" },
]
dynamic = ["version"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
] # https://pypi.org/classifiers/

# Declared here rather than in requirements*.txt files: Renovate updates a
# PEP 621 dependency and regenerates uv.lock in the same PR, which it cannot do
# for requirements files read through a build-backend hook.
dependencies = [
    # keep-sorted start
    "more-itertools==11.1.0",
    "psycopg-binary==3.3.5",
    "psycopg-pool==3.3.1",
    "psycopg==3.3.5",
    "requests==2.34.2",
    # keep-sorted end
]

[project.optional-dependencies]
cli = [
    # keep-sorted start
    "argparse==1.4.0",
    "python-dotenv==1.2.3",
    # keep-sorted end
]
dev = [
    # keep-sorted start
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "wheel-inspect==1.8.0",
    # keep-sorted end
]

[project.urls]
"Bug reports" = "https://github.com/MihaiBojin/waf-downloader/issues/new"
"Documentation" = "https://github.com/MihaiBojin/waf-downloader/blob/main/python/README.md"
"Source" = "https://github.com/MihaiBojin/waf-downloader"

[project.scripts]
waf-downloader = "waf_logs_cli.cli:main"

# uv is the front end; hatchling stays the build backend.
# `explicit = true` keeps test.pypi out of dependency resolution: it is only
# ever addressed by name, via `uv publish --index testpypi`.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# https://git-scm.com/docs/gitignore#_pattern_format
#
# Directories must use the '/**' form. A bare directory name loses to a
# re-inclusion in .gitignore -- '!.vscode/settings.json' there was enough to
# pull .vscode into the sdist despite a '.vscode' entry here.
exclude = [
    # keep-sorted start
    ".devcontainer/**",
    ".dockerignore",
    ".env",
    ".github/**",
    ".pre-commit-config.yaml",
    ".pypirc",
    ".python-version",
    ".vscode/**",
    "Dockerfile",
    "Taskfile.yml",
    "charts/**",
    "renovate.json",
    "scripts/**",
    "tests/**",
    "uv.lock",
    # keep-sorted end
]

[tool.hatch.build.targets.wheel]
packages = ["src/waf_logs", "src/waf_logs_cli"]

[tool.hatch.version]
path = "./VERSION"
pattern = "(?P<version>.+)"

[tool.mypy]
# keep-sorted start
check_untyped_defs = true
disallow_untyped_calls = true
namespace_packages = false
pretty = true
show_column_numbers = true
show_error_codes = true
warn_no_return = false
warn_unused_ignores = true
# keep-sorted end

[[tool.mypy.overrides]]
module = 'requests.*'
ignore_missing_imports = true

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's implicit defaults have widened over
# releases: upgrading the hook from 0.7 to 0.16 turned on hundreds of rules at
# once and surfaced 72 findings in code that had not changed. Stating the
# policy here means a ruff upgrade is a tooling bump, not a silent change to
# what counts as an error. Widen deliberately, not by upgrade.
select = ["E4", "E7", "E9", "F"]
